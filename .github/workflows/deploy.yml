name: Deploy to Synology

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create production environment files
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          umask 077
          printf '%s\n' "$BACKEND_ENV" > backend/.env
          printf '%s\n' "$FRONTEND_ENV" > frontend/.env

      - name: Deploy with Docker Compose
        run: bash deploy.sh prod
